<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinecone checkout</title>
<style>
  body { font: 17px system-ui, sans-serif; color: #23372c; background: #f2f5ef; margin: 0; }
  main { max-width: 440px; margin: 8vh auto; padding: 32px; background: white; border-radius: 18px; }
  h1 { margin-top: 0; } p { line-height: 1.5; } label { display: block; margin: 18px 0; }
  input { display: block; box-sizing: border-box; width: 100%; padding: 10px; margin-top: 6px; font: inherit; }
  output { display: block; padding-top: 20px; border-top: 1px solid #ccd5c8; font-size: 24px; }
  small { display: block; margin-top: 18px; line-height: 1.5; color: #526052; }
</style>
<main>
  <h1>Pinecone checkout</h1>
  <p>Preview an order with a fixed dollar coupon. Sales tax applies to the discounted subtotal.</p>
  <form id="checkout">
    <label>Subtotal ($)<input name="subtotal" type="number" min="0" step="0.01" value="100" required></label>
    <label>Sales tax (%)<input name="tax" type="number" min="0" max="100" step="0.01" value="8" required></label>
    <label>Coupon ($)<input name="coupon" type="number" min="0" step="0.01" value="10" required></label>
    <output id="total" aria-live="polite"></output>
  </form>
  <small>Local bug reproduction. PIN-184 expects $97.20 for a $100 order, 8% tax, and a $10 coupon. No payment is collected.</small>
</main>
<script type="module">
  import { checkoutTotal } from './checkout.js';
  const form = document.querySelector('#checkout');
  function update() {
    const subtotal = form.elements.subtotal.valueAsNumber;
    const coupon = form.elements.coupon.valueAsNumber;
    form.elements.coupon.max = String(subtotal);
    document.querySelector('#total').textContent = form.checkValidity()
      ? `Order total: ${new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(checkoutTotal(subtotal, form.elements.tax.valueAsNumber / 100, coupon))}`
      : 'Enter a valid order and a coupon no larger than the subtotal.';
  }
  form.addEventListener('input', update);
  form.addEventListener('submit', event => event.preventDefault());
  update();
</script>
</html>
